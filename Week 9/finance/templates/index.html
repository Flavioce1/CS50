{% extends "layout.html" %}

{% block title %}
    Portfolio
{% endblock %}

{% block main %}
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Name</th>
                <th>Shares</th>
                <th>Price</th>
                <th>TOTAL</th>
            </tr>
        </thead>
        <tbody>
            {% for h in holdings %}
                <tr>
                    <td>{{ h.symbol }}</td>
                    <td>{{ h.name }}</td>
                    <td>{{ h.shares }}</td>
                    <td>{{ h.price | usd }}</td>
                    <td>{{ h.total | usd }}</td>
                </tr>
            {% endfor %}
            <tr>
                <td colspan="4" class="text-end"><strong>Cash</strong></td>
                <td>{{ cash | usd }}</td>
            </tr>
            <tr>
                <td colspan="4" class="text-end"><strong>TOTAL</strong></td>
                <td>{{ total | usd }}</td>
            </tr>
        </tbody>
    </table>
{% endblock %}
