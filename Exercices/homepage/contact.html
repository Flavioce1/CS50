<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavien — Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">Flavien.</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="parcours.html">Parcours</a></li>
                    <li class="nav-item"><a class="nav-link" href="projets.html">Projets</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    <li class="nav-item"><button id="theme-toggle" class="btn btn-sm btn-outline-light ms-lg-3">🌙</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1>Me contacter</h1>
        <p class="lead">Une question, un projet, une idée ? Écris-moi.</p>

        <form id="contact-form" class="mt-4" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Nom</label>
                <input type="text" class="form-control" id="name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn btn-accent">Envoyer</button>
        </form>

        <div id="form-feedback" class="mt-3"></div>

        <hr class="my-5">

        <h2>Autres canaux</h2>
        <ul>
            <li>Blog : <a href="https://everydayaitech.com" target="_blank" rel="noopener">EverydayAITech.com</a></li>
            <li>Localisation : Corbigny, Nièvre (France)</li>
        </ul>
    </main>

    <footer id="site-footer">
        <p>© 2026 Flavien — Réalisé pour CS50x PSet 8.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
